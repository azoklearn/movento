    <!-- Purpose-built icons rather than one 512px file squashed into every slot,
         and a real favicon.ico so clients that request it by default do not get
         index.html back through the SPA rewrite. Versioned so a logo swap is not
         served from the months-old favicon browsers cache aggressively. -->
    <link rel="icon" href="/favicon.ico?v=3" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=3" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=3" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Load fonts without blocking first paint: swap them in once they arrive. -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" media="print" onload="this.media='all'" />

    <link rel="dns-prefetch" href="https://motionsites.ai" />
    <link rel="dns-prefetch" href="https://image.mux.com" />
    <!-- Structured data. The FAQ entries mirror the questions actually rendered
         in the #faq section — Google drops (and penalises) FAQ markup that does
         not appear on the page, so the two must be kept in sync. -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "WebSite",
          "@id": "https://movento.dev/#website",
          "url": "https://movento.dev/",
          "name": "Movento",
          "inLanguage": "fr-FR",
          "description": "Bibliothèque de prompts IA pour créer un site internet sans coder.",
          "publisher": { "@id": "https://movento.dev/#organization" }
        },
        {
          "@type": "Organization",
          "@id": "https://movento.dev/#organization",
          "name": "Movento",
          "url": "https://movento.dev/",
          "logo": "https://movento.dev/logo.png",
          "email": "movento.dev@gmail.com"
        },
        {
          "@type": "Product",
          "name": "Movento — Bibliothèque de prompts IA pour sites web",
          "description": "Prompts premium à copier-coller dans Lovable, v0, Bolt, Cursor, Claude ou Shopify pour générer un site internet complet sans coder.",
          "image": "https://movento.dev/logo.png",
          "brand": { "@id": "https://movento.dev/#organization" },
          "aggregateRating": {
            "@type": "AggregateRating",
            "ratingValue": "4.8",
            "bestRating": "5",
            "ratingCount": "120"
          },
          "offers": [
            {
              "@type": "Offer",
              "name": "Accès à vie",
              "price": "89",
              "priceCurrency": "EUR",
              "url": "https://movento.dev/pricing",
              "availability": "https://schema.org/InStock"
            }
          ]
        },
        {
          "@type": "FAQPage",
          "mainEntity": [
            {
              "@type": "Question",
              "name": "Comment ça marche ?",
              "acceptedAnswer": { "@type": "Answer", "text": "Choisissez un prompt dans la galerie, copiez-le en un clic, collez-le dans Lovable, v0, Bolt, Cursor, Claude ou Shopify. L'IA génère le site complet — il ne vous reste qu'à personnaliser le contenu." }
            },
            {
              "@type": "Question",
              "name": "Quels outils sont compatibles ?",
              "acceptedAnswer": { "@type": "Answer", "text": "Tous les outils IA qui acceptent un prompt texte : Lovable, v0, Bolt, Cursor, Claude, Shopify, ChatGPT... Les prompts décrivent chaque détail (polices, couleurs, animations) pour un résultat fidèle." }
            },
            {
              "@type": "Question",
              "name": "Y a-t-il quelque chose à résilier ?",
              "acceptedAnswer": { "@type": "Answer", "text": "Non. L'accès est un paiement unique, sans abonnement et sans rien qui se représente. Un ancien abonnement mensuel reste résiliable à tout moment depuis la page Mon abonnement ou directement sur Whop." }
            },
            {
              "@type": "Question",
              "name": "Comment j'accède aux prompts après paiement ?",
              "acceptedAnswer": { "@type": "Answer", "text": "L'email utilisé au paiement est votre clé d'accès. Entrez-le dans la galerie sur n'importe quel appareil et tous les prompts se débloquent instantanément." }
            },
            {
              "@type": "Question",
              "name": "Le catalogue est-il mis à jour ?",
              "acceptedAnswer": { "@type": "Answer", "text": "Oui — de nouveaux prompts premium sont ajoutés régulièrement, et ils sont tous inclus dans votre accès sans surcoût." }
            },
            {
              "@type": "Question",
              "name": "Puis-je utiliser les sites commercialement ?",
              "acceptedAnswer": { "@type": "Answer", "text": "Oui. Les sites que vous générez à partir de nos prompts vous appartiennent — projets clients, portfolios, lancements de produits, tout est permis." }
            }
          ]
        }
      ]
    }
    </script>
    <style>
      html, body { margin: 0; background: #0A0A0B; }
      @keyframes mv-spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- Instant boot splash: shows before the app JS downloads so mobile users
           never stare at a blank page. React replaces #root on first render. -->
      <div style="position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;background:#0A0A0B;font-family:system-ui,-apple-system,'Segoe UI',sans-serif">
        <img src="/logo.png?v=3" alt="" width="56" height="56" style="width:56px;height:56px;object-fit:contain" />
        <div style="font-size:28px;font-weight:700;letter-spacing:-0.03em;color:#EDE9E0">Movento</div>
        <div style="width:24px;height:24px;border:2.5px solid rgba(255,255,255,0.12);border-top-color:rgba(237,233,224,0.85);border-radius:50%;animation:mv-spin .7s linear infinite"></div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
